# =============================================================================
#  auth-service/src/main/resources/application.properties
# =============================================================================

spring.application.name=auth-service
server.port=8081

# ── Pull config from Config Server ────────────────────────────────────────────
spring.config.import=optional:configserver:http://localhost:8888

# Active profile — change to 'dev' or 'prod' at runtime
spring.profiles.active=local

# ── Database schema for this service ─────────────────────────────────────────
spring.jpa.properties.hibernate.default_schema=schema_auth

# ── Flyway — manages schema_auth migrations ───────────────────────────────────
spring.flyway.enabled=true
spring.flyway.schemas=schema_auth
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ── Kafka consumer group for this service ────────────────────────────────────
spring.kafka.consumer.group-id=auth-service-group

# ── JWT ───────────────────────────────────────────────────────────────────────
#  Secret and expiry pulled from config-repo/auth-service.properties
#  (never hardcoded here)

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# ── Springdoc / Swagger ───────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.emras.auth=DEBUG
logging.level.org.springframework.security=INFO