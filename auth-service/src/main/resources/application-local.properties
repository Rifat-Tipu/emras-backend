# =======================================================================
#  auth-service — LOCAL profile
#  Works WITHOUT Config Server running.
#  All values match docker-compose.yml exactly.
# =======================================================================

# ── Database ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/emras_db
spring.datasource.username=emras_user
spring.datasource.password=emras_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP ─────────────────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=EmrasAuthHikariLocal

# ── JPA / Hibernate ───────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=schema_auth
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Flyway ────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.schemas=schema_auth
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ── Redis ─────────────────────────────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=emras_redis_pass
spring.data.redis.timeout=2000ms

# ── Kafka ─────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.consumer.group-id=auth-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# ── JWT ───────────────────────────────────────────────────────────────────
jwt.secret=emras_local_dev_secret_key_must_be_at_least_256_bits_long_replace_in_prod
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# ── Eureka (disabled — no Eureka server running yet) ─────────────────────
eureka.client.enabled=false

# ── Actuator ──────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# ── Swagger ───────────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Logging ───────────────────────────────────────────────────────────────
logging.level.com.emras=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n