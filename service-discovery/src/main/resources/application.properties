# =============================================================================
#  service-discovery/src/main/resources/application.properties
# =============================================================================

spring.application.name=service-discovery
server.port=8761

# ── Import config from Config Server ──────────────────────────────────────────
#  'optional:' prefix means: if Config Server is unreachable, keep starting up.
#  Remove 'optional:' if you want a hard failure when Config Server is down.
spring.config.import=optional:configserver:http://localhost:8888

# Active profile — override at runtime with: -Dspring.profiles.active=dev
spring.profiles.active=local

# ── Eureka — Standalone mode (does NOT register with itself) ──────────────────
#  A Eureka server should not try to register with or fetch from itself.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.server.wait-time-in-ms-when-sync-empty=0
eureka.server.enable-self-preservation=false

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.emras=DEBUG
logging.level.com.netflix.eureka=WARN
logging.level.com.netflix.discovery=WARN