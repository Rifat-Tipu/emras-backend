# =============================================================================
#  config-server/src/main/resources/application-dev.properties
#  DEV profile for Config Server — reads from a remote Git repository.
#  Use this when deploying Config Server inside Docker / CI.
# =============================================================================

spring.application.name=config-server
server.port=8888

# ── Config source — remote Git repository ─────────────────────────────────────
spring.cloud.config.server.git.uri=${CONFIG_GIT_URI:https://github.com/YOUR_USERNAME/emras-config-repo}
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.timeout=10
spring.cloud.config.server.git.username=${CONFIG_GIT_USERNAME:}
spring.cloud.config.server.git.password=${CONFIG_GIT_PASSWORD:}

# ── Eureka ────────────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=http://service-discovery:8761/eureka/

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,env,refresh
management.endpoint.health.show-details=always

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.emras=INFO
logging.level.org.springframework.cloud.config=INFO