# =============================================================================
#  config-server/src/main/resources/application.properties
#  This is the Config Server's OWN config (not what it serves to others).
# =============================================================================

spring.application.name=config-server
server.port=8888

# ── Config source — native filesystem (for local development) ────────────────
#  In production, change to 'git' and point to your private GitHub config repo.
spring.profiles.active=native,local

# 'native' profile means: read config files from local filesystem, not Git.
# Spring Cloud Config will look in the path below for {service-name}.properties
spring.cloud.config.server.native.search-locations=file:${user.dir}/../config-repo

# ── Eureka — Config Server also registers itself ──────────────────────────────
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,env,refresh
management.endpoint.health.show-details=always

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.emras=DEBUG
logging.level.org.springframework.cloud.config=DEBUG