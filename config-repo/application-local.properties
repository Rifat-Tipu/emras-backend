# =============================================================================
#  application-local.properties — LOCAL PROFILE
#  For running services directly in IntelliJ IDEA on your machine.
#  All infrastructure (Postgres, Redis, Kafka) is accessed via localhost
#  because Docker maps container ports to host ports.
# =============================================================================

# ── PostgreSQL 18 (running in Docker, port mapped to host) ───────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/emras_db
spring.datasource.username=emras_user
spring.datasource.password=emras_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP Connection Pool ──────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=EmrasHikariLocal

# ── Redis ─────────────────────────────────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=emras_redis_pass
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=5
spring.data.redis.lettuce.pool.max-idle=3
spring.data.redis.lettuce.pool.min-idle=1

# ── Kafka ─────────────────────────────────────────────────────────────────────
#  Use port 29092 (PLAINTEXT_HOST listener — for services on host machine)
spring.kafka.bootstrap-servers=localhost:29092

# ── Eureka ────────────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ── Logging (more verbose locally) ───────────────────────────────────────────
logging.level.com.emras=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.show-sql=true

# ── Zipkin ────────────────────────────────────────────────────────────────────
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans