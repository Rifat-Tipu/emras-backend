# =============================================================================
#  application.properties — SHARED DEFAULTS (inherited by ALL microservices)
#  Spring Cloud Config Server serves this to every service on startup.
#  Service-specific files override these values.
# =============================================================================

# ── Eureka ────────────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.client.registry-fetch-interval-seconds=10

# ── Spring Actuator ───────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,loggers
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.prometheus.metrics.export.enabled=true

# ── Micrometer Tracing ────────────────────────────────────────────────────────
#  Spring Boot 3.x uses Micrometer as the tracing abstraction.
#  The bridge (micrometer-tracing-bridge-brave) hooks into Brave (Zipkin's
#  tracer library). Spans are exported to Zipkin via zipkin-reporter-brave.
#  If Zipkin is unreachable the app still works — it just can't export traces.
#  Trace ID and Span ID are ALWAYS injected into MDC and log lines regardless.
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
#  ddl-auto=validate : Flyway manages schema; Hibernate only validates on boot.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Kafka (shared defaults) ───────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.properties.schema.registry.url=http://localhost:8085

# ── Jackson (JSON) ────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ── Logging ───────────────────────────────────────────────────────────────────
#  %X{traceId} and %X{spanId} are automatically populated by Micrometer Tracing
logging.level.root=INFO
logging.level.com.emras=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId},%X{spanId}] [%thread] %-5level %logger{40} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId},%X{spanId}] [%thread] %-5level %logger{40} - %msg%n