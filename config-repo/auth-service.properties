# =============================================================================
#  config-repo/auth-service.properties
#  Auth-service-specific configuration — served by Config Server.
#  These values apply across ALL profiles unless overridden below.
# =============================================================================

# ── JWT ───────────────────────────────────────────────────────────────────────
#  Use a strong 256-bit+ secret in production. Override per profile below.
jwt.secret=emras_local_dev_secret_key_must_be_at_least_256_bits_long_replace_in_prod
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# ── OTP ───────────────────────────────────────────────────────────────────────
otp.length=6
otp.expiry-minutes=3
otp.max-attempts=5

# ── Account lockout ───────────────────────────────────────────────────────────
auth.max-login-attempts=5
auth.lockout-duration-minutes=30

# ── OAuth2 ────────────────────────────────────────────────────────────────────
#  Google and Facebook client IDs — override in profile-specific files
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/api/v1/auth/oauth2/callback/google

spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:your-facebook-client-id}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:your-facebook-client-secret}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/api/v1/auth/oauth2/callback/facebook

# ── Frontend URLs (for redirect after OAuth2) ─────────────────────────────────
app.frontend-url=http://localhost:3000
app.oauth2-success-redirect=http://localhost:3000/oauth2/success
app.oauth2-failure-redirect=http://localhost:3000/oauth2/failure