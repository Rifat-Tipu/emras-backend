# auth-service — PRODUCTION overrides
# All sensitive values injected via Kubernetes Secrets / environment variables
jwt.secret=${JWT_SECRET}
spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}
spring.data.redis.host=${PROD_REDIS_HOST}
spring.data.redis.password=${PROD_REDIS_PASSWORD}
spring.kafka.bootstrap-servers=${PROD_KAFKA_BOOTSTRAP_SERVERS}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
app.frontend-url=${PROD_FRONTEND_URL}
app.oauth2-success-redirect=${PROD_FRONTEND_URL}/oauth2/success
app.oauth2-failure-redirect=${PROD_FRONTEND_URL}/oauth2/failure