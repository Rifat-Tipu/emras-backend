# =============================================================================
#  application-dev.properties — DEV PROFILE
#  For services running INSIDE Docker Compose (dev server / CI environment).
#  Services talk to each other using Docker service names, not localhost.
# =============================================================================

# ── PostgreSQL 18 ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://postgres:5432/emras_db
spring.datasource.username=emras_user
spring.datasource.password=emras_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP ──────────────────────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=EmrasHikariDev

# ── Redis ─────────────────────────────────────────────────────────────────────
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=emras_redis_pass
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=2

# ── Kafka ─────────────────────────────────────────────────────────────────────
#  Use port 9092 (PLAINTEXT — internal Docker network)
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.properties.schema.registry.url=http://schema-registry:8081

# ── Eureka ────────────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=http://service-discovery:8761/eureka/

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.emras=DEBUG
logging.level.org.hibernate.SQL=INFO
spring.jpa.show-sql=false

# ── Zipkin ────────────────────────────────────────────────────────────────────
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans